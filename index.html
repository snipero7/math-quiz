<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدي الرياضيات المتجدد</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172b49;background:#f1f5fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#193876,#3678d5);color:white;padding:32px 18px}header>div,main{max-width:850px;margin:auto}header h1{margin:0 0 10px}header p{margin:0}main{padding:24px 16px 50px}.card{background:white;border:1px solid #dce4ef;border-radius:20px;padding:25px;margin-bottom:17px;box-shadow:0 8px 25px #1233 06}.hidden{display:none!important}.muted{color:#64748b}.btn,.choice,.nav{font:inherit;cursor:pointer}.btn{border:0;border-radius:12px;padding:14px 20px;background:#2467cc;color:white;font-weight:bold}.btn.alt{background:#e8f0ff;color:#2467cc}.btn:disabled{opacity:.4;cursor:not-allowed}input{font:inherit;padding:13px;border-radius:11px;border:1px solid #aebfd6;width:100%;max-width:430px;margin:8px 0 20px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.progress{height:12px;border-radius:30px;background:#e8eef6;overflow:hidden;margin:17px 0}.fill{height:100%;background:#2782d5;width:0}.question{direction:rtl;unicode-bidi:plaintext;font-size:23px;font-weight:bold;line-height:2;white-space:pre-line}.choices{display:grid;gap:11px;margin-top:22px}.choice{border:2px solid #dce6f2;background:white;border-radius:12px;padding:14px;text-align:right;color:#1e3554;min-height:60px}.choice.selected{border-color:#2467cc;background:#eef5ff}.navlist{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.nav{width:38px;height:38px;background:white;border:1px solid #b7c8dd;border-radius:9px}.nav.done{background:#d5eaff}.nav.current{outline:2px solid #2467cc}.review{border-top:1px solid #dfe7f2;padding:18px 0}.review h3{white-space:pre-line}.solution{background:#eff5ff;padding:14px;border-radius:10px;line-height:1.9}.score{font-size:55px;color:#2467cc;font-weight:900}.good{color:#167948}.bad{color:#b12c42}footer{text-align:center;color:#687991;padding:15px}@media print{header,#intro,#exam,.actions,.navlist,footer{display:none!important}body{background:white}.card{border:0;box-shadow:none}.review{break-inside:avoid}}
</style></head><body><header><div><h1>✦ تحدي الرياضيات المتجدد</h1><p>١٢ مهارة • أسئلة جديدة كل مرة • النتيجة بعد إكمال الاختبار</p></div></header><main>
<section id="intro" class="card"><h2>جاهزة للتحدي؟ 🌟</h2><p>توليد تلقائي لأسئلة مشابهة لورقة التدريب، مع خيارات مختلفة وتصحيح وشرح الحل بعد إنهاء الاختبار.</p><label for="student">اسم الطالبة</label><div><input id="student" maxlength="65" placeholder="اكتبي اسمك"></div><button class="btn" id="begin">ابدئي الاختبار</button><p id="last" class="muted"></p></section>
<section id="exam" class="card hidden"><div id="counter"></div><div class="progress"><div id="fill" class="fill"></div></div><p id="skill" class="muted"></p><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="navlist" class="navlist"></div><div class="actions"><button id="next" class="btn">التالي</button><button id="prev" class="btn alt">السابق</button><button id="finish" class="btn" disabled>إنهاء الاختبار وعرض النتيجة</button></div><p id="note" class="muted"></p></section>
<section id="results" class="hidden"><div class="card"><h2 id="greeting"></h2><div id="score" class="score"></div><p id="summary"></p><div class="actions"><button class="btn" id="retry">اختبار جديد بأسئلة مختلفة</button><button class="btn alt" id="reviewbtn">مراجعة الحلول</button><button class="btn alt" id="print">طباعة النتيجة</button></div></div><div class="card hidden" id="review"><h2>المراجعة وطرق الحل</h2><div id="reviewlist"></div></div></section></main><footer>يعمل دون إنترنت بعد حفظ الملف. آخر نتيجة محفوظة في المتصفح فقط.</footer>
<script>
(function(){
'use strict';
const el=id=>document.getElementById(id),ar=x=>String(x).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choose=a=>a[rand(0,a.length-1)],fmt=x=>ar(String(x).replace(/\B(?=(\d{3})+(?!\d))/g,'٬'));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=rand(0,i),v=a[i];a[i]=a[j];a[j]=v}return a}
function make(skill,question,answer,wrong,solution){let options=shuffle([answer,...wrong]).map(String);if(new Set(options).size!==4)throw Error('خيارات مكررة');return{skill,question,answer:String(answer),options,solution}}
function gen1(){let places=['آحاد','عشرات','مئات','آلاف','عشرات الآلاف','مئات الآلاف','آحاد الملايين','عشرات الملايين','مئات الملايين','آحاد البلايين','عشرات البلايين'];let digits=Array.from({length:11},()=>rand(1,9)),p=rand(0,10),num=digits.join(''),correct=places[p];return make('المنزلة العددية','ما منزلة الرقم المحاط بقوسين؟\n'+'\u2066'+ar(num.slice(0,10-p))+'〔'+ar(digits[10-p])+'〕'+ar(num.slice(11-p))+'\u2069',correct,shuffle(places.filter(x=>x!==correct)).slice(0,3),'نعد المنازل من اليمين بدءًا من الآحاد. المنزلة المطلوبة هي '+correct+'.')}
function gen2(){let n=rand(11,98);while(n%10===0)n=rand(11,98);return make('الكسور العشرية','ما الكسر الاعتيادي المكافئ للعدد '+ar('٠٫'+String(n).padStart(2,'0'))+'؟',ar(n)+' / ١٠٠',[ar(n)+' / ١٠',ar(n)+' / ١٠٠٠',ar(n)+' / ١٠٠٠٠'],'يوجد رقمان بعد الفاصلة؛ إذن المقام ١٠٠ والبسط '+ar(n)+'.')}
function gen3(){let a=rand(3,29),d=rand(101,989),n=a+d/1000,target=+(n.toFixed(1)),f=v=>ar(v.toFixed(1).replace('.', '٫'));return make('التقريب','قرّبي '+ar(n.toFixed(3).replace('.', '٫'))+' لأقرب جزء من عشرة.',f(target),[target-.1,target+.1,target+.2].map(f),'ننظر لرقم الجزء من مئة؛ إن كان ٥ أو أكبر نزيد الجزء من عشرة، وإلا نبقيه. الناتج '+f(target)+'.')}
function gen4(){let p=rand(2,7),d=rand(2,8),base=rand(10,89)*100000000+rand(10,99)*1000000+rand(100000,999999),n=Math.floor(base/10**(p+1))*10**(p+1)+d*10**p+base%10**p,val=d*10**p;return make('القيمة المنزلية','ما القيمة المنزلية للرقم '+ar(d)+' في العدد '+fmt(n)+'؟',fmt(val),[fmt(d*10**(p-1)),fmt(d*10**(p+1)),fmt(d*10**(p+2))],'نضرب الرقم في قيمة منزلته: '+ar(d)+' × '+fmt(10**p)+' = '+fmt(val)+'.')}
function gen5(){let a=rand(2,9),b=rand(2,9),c=rand(2,9);return make('خصائص الجمع','أي خاصية توضح الجملة؟\n('+ar(a)+' + '+ar(b)+') + '+ar(c)+' = '+ar(a)+' + ('+ar(b)+' + '+ar(c)+')','الخاصية التجميعية',['الخاصية الإبدالية','العنصر المحايد','خاصية التوزيع'],'تغير موضع الأقواس فقط، ولذلك هي الخاصية التجميعية.')}
function gen6(){let a=rand(1,8),b=rand(1,8),c=rand(1,9);return make('قيمة الرقم العشري','في العدد '+ar(a)+'٫'+ar(b)+ar(c)+'، ما قيمة الرقم '+ar(c)+'؟',ar(c)+' أجزاء من مئة',[ar(c)+' أجزاء من عشرة',ar(c)+' أجزاء من ألف',ar(c)+' آحاد'],'الرقم الثاني يمين الفاصلة يقع في منزلة الأجزاء من مئة.')}
function gen7(){let a=rand(30,78),b=rand(15,69),s=a+b;return make('الجمع الذهني','ما ناتج '+ar(a)+' + '+ar(b)+' ذهنيًا؟',ar(s),[ar(s-1),ar(s+1),ar(s+10)],'نجمع العشرات ثم الآحاد لنحصل على '+ar(s)+'.')}
function gen8(){let b=rand(12,240),m=rand(2,95),t=rand(115,985),u=rand(11,99),v=BigInt(b)*1000000000n+BigInt(m)*1000000n+BigInt(t)*1000n+BigInt(u);return make('الصيغة القياسية','اكتبي الصيغة القياسية: '+ar(b)+' بليونًا و'+ar(m)+' مليونًا و'+ar(t)+' ألفًا و'+ar(u)+'.',fmt(v),[fmt(v+1000000n),fmt(v+1000n),fmt(v+1000000000n)],'نرتب البلايين ثم الملايين ثم الآلاف ثم الآحاد: '+fmt(v)+'.')}
function gen9(){let a=rand(51,94),b=rand(41,89),x=Math.round(a/10)*10,y=Math.round(b/10)*10,s=x+y;return make('التقدير بالتقريب','قدّري المجموع لأقرب عشرة:\n'+ar(a)+' + '+ar(b),ar(s),[ar(s-20),ar(s+20),ar(s+40)],'نقرّب '+ar(a)+' إلى '+ar(x)+'، و'+ar(b)+' إلى '+ar(y)+'، ثم نجمع = '+ar(s)+'.')}
function gen10(){let a=rand(4,16),step=choose([2,3,4,5,6]),numbers=[0,1,2,3].map(i=>a+i*step),ans=a+4*step;return make('الأنماط العددية','عدد الأشواط في أربعة أسابيع: '+numbers.map(ar).join('، ')+'؛ كم شوطًا في الأسبوع الخامس؟',ar(ans)+' شوطًا',[ar(ans-step)+' شوطًا',ar(ans+1)+' شوطًا',ar(ans+step)+' شوطًا'],'يزيد العدد بمقدار '+ar(step)+' كل مرة؛ التالي '+ar(ans)+'.')}
function gen11(){let a=rand(5,13),b=rand(14,24),sum=a+b,product=a*b,f=(x,y)=>ar(x)+' و '+ar(y);return make('التخمين والتحقق','عددان مجموعهما '+ar(sum)+' وحاصل ضربهما '+ar(product)+'، ما العددان؟',f(a,b),[f(a-1,b+1),f(a+1,b-1),f(a,b+1)],'نتحقق من الجمع والضرب: '+ar(a)+' + '+ar(b)+' = '+ar(sum)+'، و'+ar(a)+' × '+ar(b)+' = '+ar(product)+'.')}
function gen12(){let vals=[rand(200,299),rand(300,399),rand(400,499)];vals=shuffle(vals);let f=v=>ar(Math.floor(v/100)+'٫'+String(v%100).padStart(2,'0')),s=vals.slice().sort((a,b)=>a-b),out=a=>a.map(f).join(' ، ');return make('ترتيب الكسور العشرية','رتّبي الأعداد من الأصغر إلى الأكبر:\n'+out(vals),out(s),[out(s.slice().reverse()),out([s[1],s[0],s[2]]),out([s[0],s[2],s[1]])],'نقارن الأجزاء الصحيحة ثم العشرية؛ الترتيب: '+out(s)+'.')}
let questions=[],answers=[],index=0,name='';
function screen(id){['intro','exam','results'].forEach(n=>el(n).classList.toggle('hidden',n!==id))}
function start(){questions=[gen1,gen2,gen3,gen4,gen5,gen6,gen7,gen8,gen9,gen10,gen11,gen12].map(f=>f());answers=Array(12).fill(null);index=0;screen('exam');render();scrollTo(0,0)}
function render(){let q=questions[index],done=answers.filter(a=>a!==null).length;el('counter').textContent='السؤال '+ar(index+1)+' من ١٢ — أُجيب عن '+ar(done)+' أسئلة';el('fill').style.width=done/12*100+'%';el('skill').textContent=q.skill;el('question').textContent=q.question;el('choices').replaceChildren();q.options.forEach((option,i)=>{let b=document.createElement('button');b.className='choice'+(answers[index]===option?' selected':'');b.textContent='أبجد'[i]+' — '+option;b.setAttribute('aria-pressed',String(answers[index]===option));b.onclick=()=>{answers[index]=option;render()};el('choices').append(b)});el('navlist').replaceChildren();questions.forEach((q,i)=>{let b=document.createElement('button');b.className='nav'+(index===i?' current':'')+(answers[i]!==null?' done':'');b.textContent=ar(i+1);b.onclick=()=>{index=i;render()};el('navlist').append(b)});el('next').disabled=index===11;el('prev').disabled=index===0;el('finish').disabled=done!==12;el('note').textContent=done===12?'يمكنك الآن إنهاء الاختبار.':'أجيبي عن جميع الأسئلة لتفعيل زر النتيجة.'}
el('begin').onclick=()=>{name=el('student').value.trim()||'الطالبة';start()};el('next').onclick=()=>{if(index<11){index++;render()}};el('prev').onclick=()=>{if(index>0){index--;render()}};
el('finish').onclick=()=>{if(answers.some(x=>x===null))return;let score=questions.filter((q,i)=>q.answer===answers[i]).length;el('greeting').textContent='نتيجة الطالبة: '+name;el('score').textContent=ar(score)+' / ١٢';el('summary').textContent='النسبة: '+ar(Math.round(score/12*100))+'٪ — '+(score===12?'رائع، علامة كاملة! 🌟':score>=9?'أحسنتِ! 👏':'يمكنك التحسن بالممارسة 💪');let review=el('reviewlist');review.replaceChildren();questions.forEach((q,i)=>{let box=document.createElement('div');box.className='review';let h=document.createElement('h3');h.textContent=ar(i+1)+'. '+q.question;let ans=document.createElement('p');ans.className=answers[i]===q.answer?'good':'bad';ans.textContent=(answers[i]===q.answer?'✓ صحيح':'✕ غير صحيح')+' — إجابتك: '+answers[i];let correct=document.createElement('p');correct.textContent='الإجابة الصحيحة: '+q.answer;let sol=document.createElement('p');sol.className='solution';sol.textContent=q.solution;box.append(h,ans,correct,sol);review.append(box)});el('review').classList.add('hidden');el('reviewbtn').textContent='مراجعة الحلول';try{localStorage.setItem('mathQuizLast',JSON.stringify({name,score,date:new Date().toLocaleString('ar-SA')}))}catch(e){}screen('results');scrollTo(0,0)};
el('retry').onclick=start;el('reviewbtn').onclick=()=>{el('review').classList.toggle('hidden');el('reviewbtn').textContent=el('review').classList.contains('hidden')?'مراجعة الحلول':'إخفاء المراجعة'};el('print').onclick=()=>{el('review').classList.remove('hidden');window.print()};try{let x=JSON.parse(localStorage.getItem('mathQuizLast'));if(x)el('last').textContent='آخر محاولة: '+x.name+' — '+ar(x.score)+' من ١٢ ('+x.date+')'}catch(e){}
})();
</script></body></html>
